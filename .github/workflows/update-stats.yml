name: Update stats images

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate stats images
        run: |
          mkdir -p assets

          download_svg() {
            local filename="$1"
            local base_url="$2"
            local target="assets/$filename"
            local temp_file="assets/temp_$filename"
            local success=false

            echo "=== Processing $filename ==="

            for attempt in 1 2 3; do
              echo "Attempt $attempt of 3..."
              local timestamp
              timestamp=$(date +%s)

              local full_url
              if [[ "$base_url" == *"?"* ]]; then
                full_url="${base_url}&_=${timestamp}"
              else
                full_url="${base_url}?_=${timestamp}"
              fi

              curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                --max-time 30 \
                "$full_url" \
                -o "$temp_file" || true

              if [[ -s "$temp_file" ]] && \
                 grep -qi "<svg" "$temp_file" && \
                 ! grep -qi "rate limit" "$temp_file" && \
                 ! grep -qi "something went wrong" "$temp_file" && \
                 ! grep -qi "user not found" "$temp_file"; then
                mv "$temp_file" "$target"
                echo "Successfully saved $filename"
                success=true
                break
              else
                echo "Validation failed for $filename on attempt $attempt"
                rm -f "$temp_file"
                if [[ $attempt -lt 3 ]]; then
                  echo "Waiting 15 seconds before retry..."
                  sleep 15
                fi
              fi
            done

            if [[ "$success" != "true" ]]; then
              echo "::warning::Failed to update $filename after 3 attempts. Keeping existing file if present."
            fi
          }

          download_svg "github-stats.svg" "https://github-readme-stats.vercel.app/api?username=valaprashant97&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=A5B4FC&icon_color=06B6D4&text_color=C9D1D9&include_all_commits=true&count_private=true&border_radius=14&rank_icon=percentile"
          download_svg "streak.svg" "https://streak-stats.demolab.com/?user=valaprashant97&theme=tokyonight&hide_border=true&background=0D1117&ring=8B5CF6&fire=06B6D4&currStreakLabel=A5B4FC&sideLabels=C9D1D9&currStreakNum=C9D1D9&sideNums=C9D1D9&border_radius=14"
          download_svg "top-langs.svg" "https://github-readme-stats.vercel.app/api/top-langs/?username=valaprashant97&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=A5B4FC&text_color=C9D1D9&langs_count=8&border_radius=14"
          download_svg "productive-time.svg" "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=valaprashant97&theme=tokyonight&utcOffset=5.5"
          download_svg "profile-details.svg" "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=valaprashant97&theme=tokyonight"
          download_svg "most-commit-language.svg" "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=valaprashant97&theme=tokyonight"
          download_svg "repos-per-language.svg" "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=valaprashant97&theme=tokyonight"
          download_svg "contrib-chart.svg" "https://ghchart.rshah.org/8B5CF6/valaprashant97"
          download_svg "leetcode.svg" "https://leetcard.jacoblin.cool/valaprashant?theme=dark&font=Fira%20Code&border=0&radius=14"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes in assets/ to commit."
          else
            git commit -m "chore: refresh stats images [skip ci]"
            git pull --rebase
            git push
          fi
